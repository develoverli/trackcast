name: Bug report
description: Something isn't working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        **Security vulnerabilities must not be reported here** — see [SECURITY.md](https://github.com/develoverli/trackcast/blob/main/SECURITY.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched [existing issues](https://github.com/develoverli/trackcast/issues) and this bug hasn't been reported yet.
          required: true
        - label: I checked the [Troubleshooting](https://github.com/develoverli/trackcast#troubleshooting) section of the README.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open TrackCast
        2. Go to ...
        3. Click ...
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: trackcast-version
    attributes:
      label: TrackCast version
      description: Shown in Settings, or the installer file name.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How are you running TrackCast?
      options:
        - Installer from GitHub Releases
        - From source (pnpm start / pnpm dev)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 23H2"
    validations:
      required: true

  - type: input
    id: obs-version
    attributes:
      label: OBS Studio version
      placeholder: "30.2.3"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Last ~100 lines of `%APPDATA%\TrackCast\logs\main.log`.
        **Remove any tokens, client secrets, or passwords before pasting.**
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots, OBS scene setup, anything else that helps.
