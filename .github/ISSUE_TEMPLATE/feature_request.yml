name: Feature request
description: Suggest an idea or improvement for TrackCast.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the use case first — we agree on scope before anyone writes code.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched [existing issues](https://github.com/develoverli/trackcast/issues) and this hasn't been requested yet.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what's getting in the way?
      placeholder: "When I stream, I'd like to ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like TrackCast to handle it?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement this?
      options:
        - "Yes, I'd like to open a pull request"
        - "No, just suggesting"
    validations:
      required: true
